[project]
name = "heatsentinel-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "tenacity",
    "python-dotenv",
    "numpy",
    "pandas",
    "osmnx",
    "networkx",
    "scipy",
    "shapely",
    "geopandas",
    "torch",
    "torchvision",
    "transformers",
    "ultralytics",
    "pillow",
    "tqdm",
    "pyarrow",
    "piexif",
    "scikit-learn",
    "joblib",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.vercel]
entrypoint = "backend.app.main:app"
