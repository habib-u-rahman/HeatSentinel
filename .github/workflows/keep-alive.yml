name: Keep Render backend warm

# Render's free tier spins the service down after ~15 min of no requests,
# and the next request pays a ~50s cold-start (loading the walk graph, RF
# model, geopandas/osmnx). Pinging /api/health every 10 minutes keeps it
# warm so judges don't hit a 502 during the demo window.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HeatSentinel backend health endpoint
        run: curl -sS -f --max-time 60 https://heatsentinel-backend.onrender.com/api/ping || true
